<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>HolyCRM Help Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Guides and answers for getting the most out of HolyCRM.app — members, groups, rotas, events, giving and more." />
  <link rel="canonical" href="https://docs.holycrm.app/" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <meta property="og:title" content="HolyCRM Help Center" />
  <meta property="og:description" content="Guides and answers for getting the most out of HolyCRM.app." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://docs.holycrm.app/" />
  <meta property="og:site_name" content="HolyCRM.app" />
  <meta property="og:image" content="https://docs.holycrm.app/assets/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="HolyCRM Help Center" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HolyCRM Help Center" />
  <meta name="twitter:description" content="Guides and answers for getting the most out of HolyCRM.app." />
  <meta name="twitter:image" content="https://docs.holycrm.app/assets/img/og-image.png" />
  <link rel="stylesheet" href="assets/help.css" />
  <!-- Markdown rendering for the guide content in content/*.md. A small,
       widely-used, pinned-version CDN library, same tradeoff as PapaParse/
       Chart.js/Choices.js in the main app (see index.html there and
       docs/data-import.md) rather than hand-rolling a parser. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>

<body>
  <header class="help-header">
    <button id="help-menu-toggle" class="help-menu-toggle" aria-label="Toggle menu">☰</button>
    <a class="help-brand" href="#/getting-started">
      <strong>HolyCRM</strong>
      <span id="help-brand-tag">Help Center</span>
    </a>
    <div class="help-search">
      <input id="help-search-input" type="search" placeholder="Search guides…" autocomplete="off" />
    </div>
    <select id="help-lang-select" class="help-lang-select" aria-label="Language"></select>
  </header>

  <div id="help-overlay" class="help-overlay"></div>

  <div class="help-shell">
    <nav id="help-sidebar" class="help-sidebar" aria-label="Help topics">
      <div id="help-sidebar-nav"></div>
    </nav>

    <main class="help-main">
      <div class="help-crumb" id="help-crumb"></div>
      <article class="help-content" id="help-content">
        <p class="help-loading">Loading…</p>
      </article>
      <nav class="help-pager" id="help-pager" aria-label="Page navigation"></nav>
    </main>
  </div>

  <!-- Generated from help/content/**/*.md by help/generate-content-data.js —
       see that script for why (raw-static folder, no fetch() at runtime). -->
  <script src="assets/content-data.js"></script>
  <script src="assets/help.js"></script>
</body>

</html>
